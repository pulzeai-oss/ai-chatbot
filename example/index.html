<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Example</title>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <p>This is a sample page with an embedded chatbot.</p>

    <!-- Chatbot settings -->
    <script>
        window.chatbotSettings = {
            apiKey: "sk-123456", // Replace with your actual API key
            title: "Ask Our AI Assistant",
            primaryColor: "#FF6523",
            secondaryColor: "#ecf0f1",
            fontFamily: "'Roboto', sans-serif",
            botAvatar: '<img src="https://cdn.prod.website-files.com/667253a488705bf38f32d9bc/667571f085708b8999394a19_6622eed31f26e2138b6a84b4_favicon.png" width="24" height="24" alt="Bot">',
            placeholderText: "Ask me anything...",
            sendButtonText: "➤",
            footerText: 'Powered by <a href="https://example.com" target="_blank">My Company</a>',
            showPoweredBy: false,
            plugins: [], // Force the use a provided plugin
            featureFlags: { "auto_tools": "true" } // Automatically let the agent choose (spaces default)
        };
    </script>

    <!-- Google Fonts for the custom font (optional) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Chatbot script -->
    <script src="../dist/chatbot.js"></script>
</body>
</html>
